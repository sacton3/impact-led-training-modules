<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ethernet bulkhead connector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --panel:#F4F5F8; --panel-ink:#14161C; --pass:#0B8F4D; --fail:#C81E24;
  --bg:#2336D8; --fg:#F4F6FF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --panel:#171A22; --panel-ink:#F1F3F8; --pass:#3DDC84; --fail:#FF6B6B; }
}
:root[data-theme="dark"]{ --panel:#171A22; --panel-ink:#F1F3F8; --pass:#3DDC84; --fail:#FF6B6B; }

*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid currentColor;outline-offset:3px}

#app{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr);gap:18px 28px;padding:18px clamp(14px,3vw,36px) 22px}
@media (min-width:900px){
  #app{height:100%;grid-template-columns:190px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
  header,footer{grid-column:1 / -1}
}

header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
h1{margin:0;font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-weight:800;font-stretch:112%;font-size:clamp(20px,2.4vw,28px);letter-spacing:-.01em}
#models{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;flex-direction:column;align-items:flex-start;border:2px solid currentColor;background:transparent;border-radius:14px;padding:6px 14px;min-height:44px;line-height:1.15;transition:background-color .2s,color .2s}
.chip b{font-family:Archivo,sans-serif;font-weight:800;font-size:15px}
.chip small{font-size:12px;opacity:.85}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

#rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
#rail button{display:flex;align-items:baseline;gap:12px;width:100%;text-align:left;background:none;border:0;border-left:5px solid transparent;padding:9px 0 9px 12px;opacity:.5;transition:opacity .2s}
#rail button:hover{opacity:.85}
#rail button.on{opacity:1;border-left-color:currentColor}
#rail .n{font-family:Archivo,sans-serif;font-weight:800;font-size:22px;min-width:1.1em}
#rail .t{font-size:16px;font-weight:700}
@media (max-width:899px){
  #rail ol{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  #rail button{border-left:0;border-bottom:4px solid transparent;padding:6px 10px;white-space:nowrap;width:auto}
  #rail button.on{border-bottom-color:currentColor}
}

#stage{position:relative;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:center}
@media (min-width:900px){ #stage{grid-template-columns:minmax(0,1fr) 350px} }
#plateWrap{min-height:0;height:100%;display:flex;align-items:center;justify-content:center}
#plateWrap svg{width:100%;height:auto;max-height:100%;overflow:hidden}
svg text{font-family:"Atkinson Hyperlegible",system-ui,sans-serif}
.ar{font-family:Archivo,"Helvetica Neue",Arial,sans-serif !important}

/* instrument panel */
#meter{background:var(--panel);color:var(--panel-ink);border:3px solid var(--panel-ink);border-radius:22px;padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px}
.mode{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;border:2px solid var(--panel-ink);border-radius:999px;font-weight:700;font-size:14px;padding:5px 12px;background:var(--panel-ink);color:var(--panel)}
.note{font-size:13px;opacity:.7}
.read{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-height:1em}
#num{font-family:Archivo,sans-serif;font-weight:800;font-stretch:105%;font-size:clamp(56px,6vw,84px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#unit{font-family:Archivo,sans-serif;font-weight:700;font-size:26px}
#status{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:16px;color:var(--panel-ink)}
#status::before{content:"";width:12px;height:12px;border-radius:50%;background:currentColor;opacity:.35}
#meter[data-state="pass"] #status{color:var(--pass)}
#meter[data-state="pass"] #status::before{opacity:1}
#meter[data-state="fail"] #status{color:var(--fail)}
#meter[data-state="fail"] #status::before{opacity:1}
.gauge{position:relative;height:78px;margin:4px 8px 0}
.gauge .bar{position:absolute;left:0;right:0;top:27px;height:14px;border-radius:7px;background:color-mix(in srgb,var(--panel-ink) 16%,transparent)}
#zone{position:absolute;top:23px;height:22px;border-radius:5px;background:var(--pass)}
#marker{position:absolute;top:7px;width:4px;height:54px;margin-left:-2px;border-radius:2px;background:var(--panel-ink);opacity:0}
#marker::before{content:"";position:absolute;top:-5px;left:50%;width:12px;height:12px;background:inherit;transform:translateX(-50%) rotate(45deg)}
#meter[data-state="fail"] #marker{background:var(--fail)}
.tick{position:absolute;top:54px;transform:translateX(-50%);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
#rule{font-size:14px;opacity:.8}
.slide{display:flex;flex-direction:column;gap:4px;font-size:13px;opacity:.9}
.slide input{width:100%;accent-color:var(--panel-ink)}
.slide input:disabled{opacity:.35}

/* paperwork flow */
#verdict{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;align-content:center;visibility:hidden;opacity:0}
.vh{font-family:Archivo,sans-serif;font-weight:800;font-size:clamp(16px,1.8vw,22px);padding:0 4px}
.vc{border-radius:16px;padding:14px 18px;font-family:Archivo,sans-serif;font-weight:600;font-size:clamp(16px,1.7vw,24px);line-height:1.2;color:#fff}
.vc.pass{background:#0B8F4D}
.vc.fail{background:#C81E24}
.vc.merge{grid-column:1 / -1;background:transparent;color:inherit;border:3px solid currentColor}
.conn{width:4px;height:20px;background:currentColor;margin:0 auto;transform-origin:top center}

footer{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 28px}
#cap{margin:0;flex:1 1 320px;max-width:62ch;min-height:3.6em;font-family:Archivo,sans-serif;font-weight:600;font-size:clamp(20px,2.2vw,30px);line-height:1.18}
.w{display:inline-block;white-space:pre}
#ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:2px solid currentColor;background:transparent;border-radius:999px;padding:9px 18px;min-height:44px;font-weight:700;font-size:16px}
.btn:disabled{opacity:.35;cursor:default}
.btn.go{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn[aria-pressed="true"]{box-shadow:inset 0 0 0 3px currentColor}
#num.word{font-size:clamp(34px,3.8vw,50px)}
#pick{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;font-weight:700}
#pick button{border:2px solid var(--panel-ink);background:transparent;color:var(--panel-ink);border-radius:999px;padding:4px 12px;min-height:32px}
#pick button[aria-pressed="true"]{background:var(--panel-ink);color:var(--panel)}
#outcome{font-size:15px;font-weight:700;min-height:2.6em}

#checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
#checks li{display:flex;gap:10px;align-items:flex-start;opacity:.55}
#checks .bx{flex:none;width:18px;height:18px;border:2px solid var(--panel-ink);border-radius:5px;margin-top:1px;position:relative}
#checks li[data-s="now"]{opacity:1}
#checks li[data-s="ok"]{opacity:1}
#checks li[data-s="ok"] .bx{background:var(--pass);border-color:var(--pass)}
#checks li[data-s="ok"] .bx::after{content:"";position:absolute;left:4px;top:0;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
#checks li[data-s="bad"]{opacity:1;color:var(--fail)}
#checks li[data-s="bad"] .bx{background:var(--fail);border-color:var(--fail)}
#checks li[data-s="bad"] .bx::after{content:"\00D7";position:absolute;inset:-4px 0 0 0;text-align:center;color:#fff;font-size:17px;line-height:20px}
.nog #num,.nog #unit,.nog #status,.nog .gauge,.nog #rule,.nog .slide,.nog .read{display:none}</style>
</head>

<script>
(function(){

const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const toHex=s=>s.startsWith('#')?s:'#'+s.match(/\d+/g).map(v=>(+v).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const x=hex(toHex(a)),y=hex(toHex(b));return 'rgb('+x.map((v,i)=>Math.round(v+(y[i]-v)*t)).join(',')+')';};

/* ---------- meter / gauge ---------- */
const meter=$('#meter'),num=$('#num'),unitEl=$('#unit'),statusEl=$('#status'),zone=$('#zone'),marker=$('#marker'),
      tickLo=$('#tickLo'),tickHi=$('#tickHi'),rule=$('#rule'),slider=$('#slider');
const G={lo:0,hi:1,min:0,max:1,dec:1,unit:'V DC'}; const R={v:null}; const P={val:0};
const pct=v=>Math.max(0,Math.min(100,(v-G.min)/(G.max-G.min)*100));
const fmt=(v,d)=>v.toFixed(d);
function configureGauge(lo,hi,dec,tdec,unit){
  const span=hi-lo;
  Object.assign(G,{lo,hi,min:lo-span*0.9,max:hi+span*0.9,dec,unit});
  zone.style.left=pct(lo)+'%'; zone.style.width=(pct(hi)-pct(lo))+'%';
  tickLo.style.left=pct(lo)+'%'; tickHi.style.left=pct(hi)+'%';
  tickLo.textContent=fmt(lo,tdec); tickHi.textContent=fmt(hi,tdec);
  rule.textContent='Pass: '+fmt(lo,tdec)+' to '+fmt(hi,tdec)+' '+unit;
  slider.min=G.min; slider.max=G.max; slider.step=(G.max-G.min)/300;
}
function render(v){
  R.v=v;
  if(v==null){num.textContent='---';unitEl.textContent='';meter.dataset.state='idle';statusEl.textContent='Not measuring';marker.style.opacity=0;return;}
  marker.style.opacity=1; marker.style.left=pct(v)+'%';
  num.textContent=fmt(v,G.dec); unitEl.textContent=G.unit;
  const ok=v>=G.lo-1e-9&&v<=G.hi+1e-9;
  meter.dataset.state=ok?'pass':'fail';
  statusEl.textContent=ok?'In range':(v<G.lo?'Too low':'Too high');
  slider.value=v;
}
slider.addEventListener('input',()=>{gsap.killTweensOf(P); render(+slider.value); if(typeof MOD!=='undefined'&&MOD.onSlide)MOD.onSlide(+slider.value);});

const AXY=140;

const PAIR={wo:-22,o:-22,wg:-7.5,g:-7.5,wb:7.5,b:7.5,wbr:22,br:22};

const slotY=s=>AXY+(s-3.5)*5;
const wiresG=$('#wiresG');
const wEl={};
Object.keys(CODES).forEach(k=>{
  const g=mk('g',{},wiresG); const c=CODES[k];
  const out=mk('path',{fill:'none',stroke:'#15161a','stroke-width':6.4,'stroke-linecap':'round'},g);
  const base=mk('path',{fill:'none',stroke:c.s?'#F4F6FF':c.c,'stroke-width':4,'stroke-linecap':'round'},g);

const ez=s=>{s=Math.max(0,Math.min(1,s));return s*s*(3-2*s);};
function drawWires(){
  const ord=ORD[S.ord];
  Object.keys(CODES).forEach(k=>{
    const sj=JUMB.indexOf(k), so=ord.indexOf(k);
    const yB=slotY(sj)+(slotY(so)-slotY(sj))*WS.o;
    const yP=AXY+PAIR[k];
    const sign=(k.length>1&&k!=='br')||k==='wbr'?1:-1;
    const tgt=yP+(yB-yP)*WS.u;
    let d='';
    for(let x=470;x<=WS.len;x+=3){
      const e=ez((x-470)/26);
      let y=AXY+(tgt-AXY)*e + (1-WS.u)*3.4*Math.sin((x-470)*.42+(sign>0?0:Math.PI))*e;
      d+=(x===470?'M':'L')+x+' '+y.toFixed(1);
    }
    wEl[k].out.setAttribute('d',d); wEl[k].base.setAttribute('d',d); if(wEl[k].st)wEl[k].st.setAttribute('d',d);
  });
}

      t.to(WS,{len:510,duration:.3,ease:'none',onUpdate:drawWires},3.0);
      t.call(()=>{const g=$('#clips');g.innerHTML='';ORD.B.forEach((k,i)=>mk('rect',{x:516+i*4,y:slotY(i)-1.6,width:16,height:3.2,rx:1,fill:CODES[k].c,class:'cl'},g));},null,3.0);
      t.fromTo('#clips .cl',{y:0,autoAlpha:1},{y:60,autoAlpha:0,duration:.7,ease:'power2.in',stagger:.03},3.05);
      t.call(()=>{check(2,'ok');setTag('Wires trimmed flush');},null,3.5);
      t.to('#jaws',{autoAlpha:0,duration:.4},3.8);
    },
    clamp(t){
      t.to('#gr',{x:432,duration:1.0,ease:'power2.inOut'},.4);
      t.to('#clip',{y:4,duration:.15,yoyo:true,repeat:1},1.5);
      t.call(()=>check(0,'ok'),null,1.5); t.call(()=>{check(1,'ok');setTag('Clip clamped down');},null,2.2);
    },
    test(t){
      const m=MOD.model;
      t.fromTo('#test',{autoAlpha:0},{autoAlpha:1,duration:.4},.2);
      if(m.key!=='full'){ t.call(()=>{$('#outcome').textContent='Skip this step until the second connector is built.';setTag('Not yet');},null,.8); return; }
      t.fromTo('#pick',{autoAlpha:0},{autoAlpha:1,duration:.3},.6);
      t.fromTo('#tRows',{opacity:0},{opacity:0,duration:0},0); t.fromTo('#tRes',{opacity:0},{opacity:0,duration:0},0);
      t.call(()=>check(0,'ok'),null,.8); t.call(()=>check(1,'ok'),null,1.4);
      t.to('#tBtn',{scale:.85,transformOrigin:'50% 50%',duration:.15,yoyo:true,repeat:1},1.8);
      t.to(['#tRows','#tRes'],{opacity:1,duration:.3},2.1);
      t.call(()=>{const k=S.tst; check(2,k==='pass'?'ok':'bad');
        $('#outcome').textContent=({pass:'Pass: the wires are in the same position at both ends, so both connectors were assembled the same way.',swap:'The numbers do not match between the rows: the two ends are not wired the same. Redo the end that is wrong.',open:'A number is missing: a wire is not making contact at one end. Redo that end.'})[k];
        setTag(k==='pass'?'Pass':'Fail');},null,2.3);
    },
    assemble(t){
      t.to('#bs',{x:354,duration:1.0,ease:'power2.inOut'},.3); t.call(()=>check(0,'ok'),null,1.2);
      t.fromTo('#hs',{autoAlpha:1},{x:640,y:AXY,duration:.9,ease:'power2.inOut'},1.4);
      t.to('#hs',{x:430,duration:1.1,ease:'power2.inOut'},2.4);
      t.call(()=>check(1,'ok'),null,3.2);
      t.fromTo('#face',{autoAlpha:0,y:10},{autoAlpha:1,y:0,duration:.5},3.6);
      t.call(()=>{check(2,'ok');setTag('Screw it together');},null,4.2);
    }
  }
};

/* ---------- player ---------- */
let steps=MOD.ORDER.slice(), cur=0, tl=null, auto=false, autoCall=null;
function renderChips(){
  const box=$('#models'); box.innerHTML='';
  if(!MOD.MODELS){return;}
  Object.values(MOD.MODELS).forEach(m=>{
    const b=document.createElement('button'); b.className='chip'; b.setAttribute('aria-pressed',m===MOD.model);
    b.innerHTML='<b>'+m.name+'</b><small>'+m.gen+'</small>'; b.onclick=()=>{MOD.model=m;renderChips();go(cur);}; box.appendChild(b);
  });
}
function renderRail(){
  const ol=$('#rail ol'); ol.innerHTML='';
  steps.forEach((id,i)=>{
    const li=document.createElement('li'); const b=document.createElement('button');
    b.className=i===cur?'on':''; if(i===cur)b.setAttribute('aria-current','step');
    b.innerHTML='<span class="n">'+(i+1)+'</span><span class="t">'+MOD.TITLES[id]+'</span>'; b.onclick=()=>go(i);
    li.appendChild(b); ol.appendChild(li);
  });
}
const cap=$('#cap');
function caption(t,text){
  cap.innerHTML='';
  text.split(' ').forEach((w,i,a)=>{const s=document.createElement('span');s.className='w';s.textContent=w+(i<a.length-1?' ':'');cap.appendChild(s);});
  t.fromTo(cap.children,{y:16,autoAlpha:0},{y:0,autoAlpha:1,duration:.4,stagger:.03,ease:'power2.out'},.2);
}
function setBtns(){ $('#bBack').disabled=cur===0; $('#bNext').textContent=cur===steps.length-1?'Restart':'Next'; }
function done(id){
  slider.disabled=!(MOD.SLIDER||[]).includes(id);
  if(MOD.done)MOD.done(id);
  if(autoCall){autoCall.kill();autoCall=null;}
  if(auto&&cur<steps.length-1) autoCall=gsap.delayedCall(2.8,()=>go(cur+1));
}
function baseReset(){
  gsap.set(['#plateWrap','#meter'],{autoAlpha:1,x:0,y:0});
  gsap.set('#verdict',{autoAlpha:0});
  gsap.set('#live',{autoAlpha:0,y:0});
  gsap.set('#tag',{autoAlpha:0,y:0});
  slider.disabled=true; gsap.killTweensOf(P);
  if(probeB){probePark(probeB,[0,0,0]);probePark(probeR,[0,0,0]);}
  configureGauge(...(MOD.gaugeCfg?MOD.gaugeCfg():[0,1,2,1,'V DC'])); render(null);
  setPick('',null); setChecks([]);
}
function go(i){
  i=Math.max(0,Math.min(steps.length-1,i));
  if(tl)tl.kill(); if(autoCall){autoCall.kill();autoCall=null;}
  gsap.killTweensOf(['#tag']);
  if(MOD.kill)MOD.kill();
  cur=i; const id=steps[i];
  renderRail(); baseReset(); MOD.prep(id);
  tl=gsap.timeline({onComplete:()=>done(id)});
  themeTween(tl,MOD.THEME_OF[id],0);
  caption(tl,MOD.CAP[id](MOD.model));
  MOD.scenes[id](tl);
  setBtns();
  if(reduce) tl.progress(1);
}
$('#bNext').onclick=()=>go(cur===steps.length-1?0:cur+1);
$('#bBack').onclick=()=>go(cur-1);
$('#bReplay').onclick=()=>go(cur);
$('#bAuto').onclick=function(){
  auto=!auto; this.setAttribute('aria-pressed',auto);
  if(auto&&tl&&!tl.isActive()&&cur<steps.length-1&&!autoCall) autoCall=gsap.delayedCall(1.2,()=>go(cur+1));
  if(!auto&&autoCall){autoCall.kill();autoCall=null;}
};
document.addEventListener('keydown',e=>{
  if(e.target&&e.target.type==='range')return;
  if(e.key==='ArrowRight')go(cur+1); else if(e.key==='ArrowLeft')go(cur-1); else if(e.key==='r'||e.key==='R')go(cur);
});
if(MOD.init)MOD.init();
renderChips(); go(0);

})();
</script>
